name: Update results
on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:
    inputs:
      years:
        description: Extra years to load, e.g. "2024 2025" (optional)
        required: false
        default: ""
      recheck_all:
        description: Re-read every saved event (e.g. after the scraper learns something new)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: update-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check arabianessence.tv for results
        id: update
        env:
          YEARS: ${{ inputs.years }}
          RECHECK_DAYS: ${{ inputs.recheck_all && '100000' || '14' }}
        run: python update_results.py $YEARS
      - name: Save changes
        run: |
          git add data
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update results: ${{ steps.update.outputs.changes }} new or changed"
          git push
